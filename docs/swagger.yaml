basePath: /api/v1
definitions:
  handlers.AccountTransferRequest:
    properties:
      amount:
        type: number
      date:
        type: string
      note:
        type: string
      to_account_id:
        type: string
    required:
    - amount
    - date
    - to_account_id
    type: object
  handlers.AllocationSummary:
    properties:
      allocated:
        type: number
      category:
        type: string
    type: object
  handlers.CreateAccountRequest:
    properties:
      color:
        type: string
      description:
        type: string
      goal_amount:
        description: SAVINGS
        type: number
      goal_label:
        description: SAVINGS
        type: string
      income_type:
        description: required for CARD
        type: string
      initial_balance:
        type: number
      name:
        type: string
      type:
        description: CARD|CASH|SAVINGS
        type: string
    required:
    - name
    - type
    type: object
  handlers.CreateAlertRequest:
    properties:
      category_id:
        type: string
      is_enabled:
        type: boolean
      threshold_percentage:
        maximum: 100
        minimum: 0
        type: integer
    required:
    - category_id
    - threshold_percentage
    type: object
  handlers.CreateCategoryRequest:
    properties:
      allocation_priority:
        type: integer
      daily_amount:
        description: required for DAILY_CONTINUOUS
        type: number
      metadata:
        additionalProperties: true
        type: object
      monthly_budget:
        type: number
      name:
        type: string
      type:
        type: string
    required:
    - name
    - type
    type: object
  handlers.CreateExpenseRequest:
    properties:
      account_id:
        type: string
      amount:
        type: number
      category_id:
        type: string
      date:
        type: string
      description:
        type: string
    required:
    - account_id
    - amount
    - category_id
    - date
    type: object
  handlers.CreateIncomeRequest:
    properties:
      account_id:
        type: string
      amount:
        type: number
      date:
        type: string
      description:
        type: string
      source:
        type: string
    required:
    - account_id
    - amount
    - date
    - source
    type: object
  handlers.CreateIncomeResponse:
    properties:
      allocations:
        items:
          $ref: '#/definitions/handlers.AllocationSummary'
        type: array
      income:
        $ref: '#/definitions/models.Income'
    type: object
  handlers.CreateNotificationSettingRequest:
    properties:
      body:
        type: string
      day_of_month:
        description: 0 = every day
        type: integer
      onesignal_player_id:
        type: string
      time_of_day:
        description: HH:MM
        type: string
      title:
        type: string
      type:
        type: string
    required:
    - body
    - onesignal_player_id
    - time_of_day
    - title
    - type
    type: object
  handlers.CreateScheduledFundRequest:
    properties:
      account_id:
        description: destination account
        type: string
      amount:
        type: number
      day_of_month:
        description: 1-31; 0 = last day
        type: integer
      description:
        type: string
      from_account_id:
        description: source for TRANSFER
        type: string
      schedule_type:
        description: TOP_UP | TRANSFER
        type: string
    required:
    - account_id
    - amount
    - schedule_type
    type: object
  handlers.CreateTransferRequest:
    properties:
      amount:
        type: number
      date:
        type: string
      from_account_id:
        type: string
      note:
        type: string
      to_account_id:
        type: string
    required:
    - amount
    - date
    - from_account_id
    - to_account_id
    type: object
  handlers.ReallocateBudgetRequest:
    properties:
      amount:
        type: number
      from_category_id:
        type: string
      month:
        type: integer
      reason:
        type: string
      to_category_id:
        type: string
      year:
        type: integer
    required:
    - amount
    - from_category_id
    - to_category_id
    type: object
  handlers.RegisterDeviceRequest:
    properties:
      onesignal_player_id:
        type: string
    required:
    - onesignal_player_id
    type: object
  handlers.SpentRequest:
    properties:
      amount:
        type: number
      category_id:
        type: string
      date:
        type: string
      description:
        type: string
    required:
    - amount
    - category_id
    - date
    type: object
  handlers.TestNotificationRequest:
    properties:
      body:
        type: string
      onesignal_player_id:
        type: string
      title:
        type: string
    required:
    - body
    - onesignal_player_id
    - title
    type: object
  handlers.TopUpRequest:
    properties:
      amount:
        type: number
      date:
        type: string
      description:
        type: string
      source:
        type: string
    required:
    - amount
    - date
    - source
    type: object
  handlers.UpdateAccountRequest:
    properties:
      color:
        type: string
      description:
        type: string
      goal_amount:
        description: SAVINGS
        type: number
      goal_label:
        description: SAVINGS
        type: string
      income_type:
        description: CARD only
        type: string
      name:
        type: string
    type: object
  handlers.UpdateAlertRequest:
    properties:
      is_enabled:
        type: boolean
      threshold_percentage:
        maximum: 100
        minimum: 0
        type: integer
    required:
    - threshold_percentage
    type: object
  handlers.UpdateCategoryRequest:
    properties:
      allocation_priority:
        type: integer
      daily_amount:
        type: number
      metadata:
        additionalProperties: true
        type: object
      monthly_budget:
        type: number
      name:
        type: string
      type:
        type: string
    type: object
  handlers.UpdateNotificationSettingRequest:
    properties:
      body:
        type: string
      day_of_month:
        type: integer
      is_enabled:
        type: boolean
      onesignal_player_id:
        type: string
      time_of_day:
        type: string
      title:
        type: string
    type: object
  handlers.UpdateScheduledFundRequest:
    properties:
      amount:
        type: number
      day_of_month:
        type: integer
      description:
        type: string
      is_active:
        type: boolean
    type: object
  models.Account:
    properties:
      balance:
        type: number
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      expenses:
        items:
          $ref: '#/definitions/models.Expense'
        type: array
      goal_amount:
        description: SAVINGS only
        type: number
      goal_label:
        type: string
      id:
        type: string
      income_type:
        description: 'Only for CARD: SALARY|PROJECT|FREELANCE|BUSINESS|OTHER'
        type: string
      incomes:
        description: Relations
        items:
          $ref: '#/definitions/models.Income'
        type: array
      is_active:
        type: boolean
      name:
        type: string
      transfers:
        items:
          $ref: '#/definitions/models.AccountTransfer'
        type: array
      type:
        description: CARD | CASH | SAVINGS
        type: string
      updated_at:
        type: string
    type: object
  models.AccountTransfer:
    properties:
      amount:
        type: number
      created_at:
        type: string
      from_account:
        allOf:
        - $ref: '#/definitions/models.Account'
        description: Relations
      from_account_id:
        type: string
      id:
        type: string
      note:
        type: string
      to_account:
        $ref: '#/definitions/models.Account'
      to_account_id:
        type: string
      transfer_date:
        type: string
      updated_at:
        type: string
    type: object
  models.BudgetAllocation:
    properties:
      allocated_amount:
        type: number
      category:
        $ref: '#/definitions/models.ExpenseCategory'
      category_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      income:
        allOf:
        - $ref: '#/definitions/models.Income'
        description: Relations
      income_id:
        type: string
      month:
        type: integer
      year:
        type: integer
    type: object
  models.CategoryBudget:
    properties:
      allocated_amount:
        type: number
      category:
        allOf:
        - $ref: '#/definitions/models.ExpenseCategory'
        description: Relations
      category_id:
        type: string
      created_at:
        type: string
      days_in_month:
        description: Snapshot of days in month
        type: integer
      effective_daily_amount:
        description: Snapshot for DAILY_CONTINUOUS
        type: number
      id:
        type: string
      month:
        description: 1-12
        type: integer
      remaining_amount:
        type: number
      spent_amount:
        type: number
      updated_at:
        type: string
      year:
        type: integer
    type: object
  models.ErrorResponse:
    properties:
      error:
        type: string
      success:
        type: boolean
    type: object
  models.Expense:
    properties:
      account:
        allOf:
        - $ref: '#/definitions/models.Account'
        description: Relations
      account_id:
        description: Account used for payment
        type: string
      amount:
        type: number
      category:
        $ref: '#/definitions/models.ExpenseCategory'
      category_id:
        type: string
      created_at:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
  models.ExpenseCategory:
    properties:
      allocation_priority:
        type: integer
      allocations:
        items:
          $ref: '#/definitions/models.BudgetAllocation'
        type: array
      budgets:
        description: Relations
        items:
          $ref: '#/definitions/models.CategoryBudget'
        type: array
      created_at:
        type: string
      daily_amount:
        description: Only for DAILY_CONTINUOUS
        type: number
      expenses:
        items:
          $ref: '#/definitions/models.Expense'
        type: array
      id:
        type: string
      is_active:
        type: boolean
      metadata:
        type: object
      monthly_budget:
        type: number
      name:
        type: string
      type:
        description: SUBSCRIPTION, DAILY_CONTINUOUS, USAGE_BASED, ONE_TIME
        type: string
      updated_at:
        type: string
    type: object
  models.Income:
    properties:
      account:
        allOf:
        - $ref: '#/definitions/models.Account'
        description: Relations
      account_id:
        description: Source account
        type: string
      allocations:
        items:
          $ref: '#/definitions/models.BudgetAllocation'
        type: array
      amount:
        type: number
      created_at:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: string
      source:
        type: string
      updated_at:
        type: string
    type: object
  models.Response:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  services.Pagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  services.Transaction:
    properties:
      amount:
        type: number
      category:
        $ref: '#/definitions/models.ExpenseCategory'
      created_at:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: string
      source:
        type: string
      type:
        description: '"income" or "expense"'
        type: string
    type: object
  services.TransactionResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/services.Transaction'
        type: array
      pagination:
        $ref: '#/definitions/services.Pagination'
      summary:
        $ref: '#/definitions/services.TransactionSummary'
    type: object
  services.TransactionSummary:
    properties:
      net_balance:
        type: number
      total_expense:
        type: number
      total_income:
        type: number
    type: object
host: localhost:8081
info:
  contact:
    email: support@financeapp.com
    name: API Support
    url: https://github.com/yourusername/finance-tracking-app
  description: A comprehensive personal finance tracking application API with budget
    management, expense tracking, and analytics
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Finance Tracking API
  version: "1.0"
paths:
  /accounts:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account data
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a new account
      tags:
      - accounts
  /accounts/{id}:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
      summary: Get account by ID
      tags:
      - accounts
    patch:
      consumes:
      - application/json
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Account update data
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
      summary: Update account details
      tags:
      - accounts
  /accounts/{id}/archive:
    post:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
      summary: Archive an account
      tags:
      - accounts
  /accounts/{id}/spent:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Expense data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SpentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Response'
      summary: Record an expense from an account
      tags:
      - accounts
  /accounts/{id}/summary:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Month (1-12)
        in: query
        name: month
        type: integer
      - description: Year
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
      summary: Get account balance summary for a specific month
      tags:
      - accounts
  /accounts/{id}/topup:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Top-up data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.TopUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Response'
      summary: Add funds (income) to an account
      tags:
      - accounts
  /accounts/{id}/transfer:
    post:
      consumes:
      - application/json
      parameters:
      - description: Source Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Transfer data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AccountTransferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Response'
      summary: Transfer funds from this account to another
      tags:
      - accounts
  /accounts/{id}/transfers:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Month (1-12)
        in: query
        name: month
        type: integer
      - description: Year
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
      summary: Get transfer history for a specific account
      tags:
      - accounts
  /accounts/summary:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
      summary: Get all accounts overview with total balance
      tags:
      - accounts
  /alerts:
    get:
      description: Get all budget alerts with current status
      parameters:
      - description: 'Filter by status: active or all (default: all)'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get all budget alerts
      tags:
      - alerts
    post:
      consumes:
      - application/json
      description: Create a new budget alert for a category
      parameters:
      - description: Alert data
        in: body
        name: alert
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAlertRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a new budget alert
      tags:
      - alerts
  /alerts/{id}:
    delete:
      description: Delete budget alert by ID
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Delete budget alert
      tags:
      - alerts
    patch:
      consumes:
      - application/json
      description: Update budget alert configuration
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      - description: Alert data
        in: body
        name: alert
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateAlertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update budget alert
      tags:
      - alerts
  /analytics/budget-performance:
    get:
      description: Get budget performance metrics for the entire year
      parameters:
      - description: Year
        in: query
        name: year
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get budget performance analysis
      tags:
      - analytics
  /analytics/category-comparison:
    get:
      description: Compare spending across categories for current vs previous month
      parameters:
      - description: Month (1-12)
        in: query
        name: month
        required: true
        type: integer
      - description: Year
        in: query
        name: year
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Compare category spending between months
      tags:
      - analytics
  /analytics/spending-pattern:
    get:
      description: Get spending pattern for a specific category over multiple months
      parameters:
      - description: Category ID (optional)
        in: query
        name: category_id
        type: string
      - description: 'Number of months (default: 6)'
        in: query
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get spending pattern for a category
      tags:
      - analytics
  /analytics/top-spending:
    get:
      description: Get categories with highest spending for a specific month
      parameters:
      - description: Month (1-12)
        in: query
        name: month
        required: true
        type: integer
      - description: Year
        in: query
        name: year
        required: true
        type: integer
      - description: 'Number of categories to return (default: 5)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get top spending categories
      tags:
      - analytics
  /budgets:
    get:
      description: Get all budget summaries for a specific month and year
      parameters:
      - description: Month (1-12)
        in: query
        name: month
        type: integer
      - description: Year
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get budgets by month and year
      tags:
      - budgets
  /budgets/reallocate:
    post:
      consumes:
      - application/json
      description: Manually reallocate budget from one category to another
      parameters:
      - description: Reallocation data
        in: body
        name: reallocation
        required: true
        schema:
          $ref: '#/definitions/handlers.ReallocateBudgetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
